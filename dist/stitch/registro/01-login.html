<script>
        // Password Toggle
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        // Real-time Validation Visual Cues
        const emailInput = document.getElementById('email');
        const emailContainer = emailInput.parentElement;
        const errorIcon = emailContainer.querySelector('.error-icon');
        const successIcon = emailContainer.querySelector('.success-icon');

        emailInput.addEventListener('input', (e) => {
            const value = e.target.value;
            if (value.length > 0) {
                const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
                if (isValid) {
                    successIcon.classList.remove('hidden');
                    errorIcon.classList.add('hidden');
                    emailContainer.classList.add('border-primary-container');
                    emailContainer.classList.remove('border-error');
                } else {
                    successIcon.classList.add('hidden');
                    errorIcon.classList.remove('hidden');
                    emailContainer.classList.remove('border-primary-container');
                    emailContainer.classList.add('border-error');
                }
            } else {
                successIcon.classList.add('hidden');
                errorIcon.classList.add('hidden');
                emailContainer.classList.remove('border-primary-container', 'border-error');
            }
        });

        // Submit Simulation with Loading Spinner & Haptic Feedback
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Simulate Haptic Feedback
            if ("vibrate" in navigator) {
                navigator.vibrate(50);
            }

            // Show Loading State
            const originalText = btnText.textContent;
            const originalIcon = btnIcon.textContent;
            
            btnText.textContent = "Procesando...";
            btnIcon.textContent = "progress_activity";
            btnIcon.classList.add('animate-spin');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            setTimeout(() => {
                // Reset State
                btnText.textContent = originalText;
                btnIcon.textContent = originalIcon;
                btnIcon.classList.remove('animate-spin');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                alert("Simulación: Inicio de sesión exitoso");
            }, 2000);
        });
    </script>
