<script>
        // Floating label logic for pre-filled inputs (though empty here, good practice)
        document.querySelectorAll('input, textarea').forEach(element => {
            element.addEventListener('blur', () => {
                if(element.value.trim() !== '') {
                    element.parentElement.classList.add('input-filled');
                } else {
                    element.parentElement.classList.remove('input-filled');
                }
            });
        });

        // Character counter for textarea
        const textarea = document.getElementById('descripcion');
        const charCount = document.getElementById('char-count');
        
        textarea.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });
    </script>
<div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 transition-opacity duration-300 opacity-0 pointer-events-none" id="photo-action-sheet">
<div class="w-full max-w-md bg-surface rounded-t-[24px] p-md flex flex-col gap-md transform translate-y-full transition-transform duration-300">

<button class="mt-sm p-md text-primary font-label-lg text-center" id="close-action-sheet">Cancelar</button>

</div><script>
    const actionSheet = document.getElementById('photo-action-sheet');
    const actionSheetContent = actionSheet.querySelector('div');
    const openBtn = document.getElementById('upload-photo-btn');
    const closeBtn = document.getElementById('close-action-sheet');

    const toggleActionSheet = (isOpen) => {
        if (isOpen) {
            actionSheet.classList.remove('opacity-0', 'pointer-events-none');
            actionSheet.classList.add('opacity-100');
            actionSheetContent.classList.remove('translate-y-full');
            actionSheetContent.classList.add('translate-y-0');
        } else {
            actionSheet.classList.add('opacity-0', 'pointer-events-none');
            actionSheet.classList.remove('opacity-100');
            actionSheetContent.classList.add('translate-y-full');
            actionSheetContent.classList.remove('translate-y-0');
        }
    };

    openBtn.addEventListener('click', () => toggleActionSheet(true));
    closeBtn.addEventListener('click', () => toggleActionSheet(false));
    actionSheet.addEventListener('click', (e) => {
        if (e.target === actionSheet) toggleActionSheet(false);
    });
</script>
