<script>
        const radioInputs = document.querySelectorAll('input[type="radio"][name="role"]');
        const continueBtn = document.getElementById('continueBtn');

        radioInputs.forEach(input => {
            input.addEventListener('change', () => {
                continueBtn.disabled = false;
            });
        });

        function navigate() {
            const role = document.querySelector('input[name="role"]:checked');
            if (!role) return;
            if (role.value === 'owner') {
                window.location.href = '{{DATA:SCREEN:SCREEN_73}}';
            } else {
                window.location.href = '{{DATA:SCREEN:SCREEN_70}}';
            }
        }
    </script>
