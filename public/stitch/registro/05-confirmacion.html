<script>
        // Form Validation Logic
        const termsCheckbox = document.getElementById('terms');
        const privacyCheckbox = document.getElementById('privacy');
        const finishBtn = document.getElementById('finishBtn');

        function checkFormValidity() {
            if (termsCheckbox.checked && privacyCheckbox.checked) {
                finishBtn.removeAttribute('disabled');
            } else {
                finishBtn.setAttribute('disabled', 'true');
            }
        }

        termsCheckbox.addEventListener('change', checkFormValidity);
        privacyCheckbox.addEventListener('change', checkFormValidity);

        // Ensure button is disabled on load based on checkbox states
        checkFormValidity();

        // Success Flow Logic
        const successOverlay = document.getElementById('successOverlay');
        const successModal = document.getElementById('successModal');

        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
            
            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }
            
            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
            
              if (timeLeft <= 0) {
                return clearInterval(interval);
              }
            
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
              }));
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
              }));
            }, 250);
        }

        finishBtn.addEventListener('click', () => {
            // Show overlay
            successOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            // Animate modal in
            setTimeout(() => {
                successModal.classList.remove('scale-95', 'opacity-0');
                successModal.classList.add('scale-100', 'opacity-100');
                if (typeof confetti === 'function') {
                    triggerConfetti();
                }
            }, 50);
        });
    </script>
